categories:
  important: "High-priority messages that genuinely need attention"
  ads: "Marketing, promotions, offers, deals"
  security: "Password resets, login alerts, 2FA codes, security notifications"
  urgent: "Time-sensitive messages with deadlines or immediate action"
  finance: "Receipts, invoices, billing, statements, payment confirmations"
  travel: "Flights, bookings, check-in, hotels, trip reservations"
  personal: "Messages from people you know, personal correspondence"
  updates: "Newsletters, product updates, notifications, receipts"
  other: "Everything that doesn't fit above"

rules:
  security_keywords:
    - "verify your identity"
    - "sign-in attempt"
    - "new device"
    - "security alert"
    - "password"
    - "verification code"
    - "authentication"
    - "unusual activity"
    - "account locked"
    - "reset your password"
    - "microsoft account"
    - "mfa"
    - "two-step verification"
  urgent_keywords:
    - "urgent"
    - "asap"
    - "deadline"
    - "today"
    - "by eod"
    - "action required"
    - "immediately"
    - "expires"
  finance_keywords:
    - "invoice"
    - "receipt"
    - "payment"
    - "billing"
    - "statement"
    - "charge"
    - "tax"
    - "refund"
    - "subscription fee"
    - "order confirmation"
  travel_keywords:
    - "flight"
    - "boarding pass"
    - "check-in"
    - "hotel"
    - "booking"
    - "itinerary"
    - "reservation"
    - "airline"
    - "departure"
    - "trip"
  allow_senders: {}
  block_senders: {}
  allow_domains: []
  block_domains: []

labels:
  ads:
    - "other"
  updates:
    - "other"
