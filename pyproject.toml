[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outlook-triage"
version = "0.1.0"
description = "Read Microsoft 365 / Outlook mail read-only and classify messages for AI agents."
requires-python = ">=3.11"
dependencies = [
    "msal>=1.24",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
outlook-triage = "outlook_triage.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
